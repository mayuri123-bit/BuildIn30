<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Help</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: rgb(232, 245, 245);
        }

        .helpbox {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: rgb(85, 154, 182);
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }

        a {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="helpbox">
        <h2>Get Help Logging In</h2>
        <p>Enter your email or username to get help with your account.</p>
        <input
            type="text"
            id="username"
            placeholder="Email or username"
        >
        <button onclick="getHelp()">Submit</button>
        <p id="message"></p>
        <a href="index.html">Back to Login</a>
    </div>
    <script>
        function getHelp() {
            let username = document.getElementById("username").value;
            if (username == "") {
                document.getElementById("message").innerHTML = "Please enter your email or username.";
                return false;
            }
            document.getElementById("message").innerHTML = "We will help you recover your account.";
            return true;
            
        }
    </script>
</body>
</html>
